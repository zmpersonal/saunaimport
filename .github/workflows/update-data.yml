name: Update trade data and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 2'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch Census trade data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/update_data.py
      - name: Commit changed data
        run: |
          git config user.name "saunaimport-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trade.json data/trade.csv
          git diff --cached --quiet || git commit -m "data: refresh Census trade data"
          git push
      - uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          mkdir _site
          cp -r assets classifications countries data methodology resources rulings _site/
          cp index.html 404.html robots.txt sitemap.xml llms.txt _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
