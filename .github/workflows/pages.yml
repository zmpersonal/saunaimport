name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage complete public site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='README.md' \
            --exclude='LICENSE'

          echo "Files being deployed:"
          find _site -maxdepth 4 -type f | sort

          # Fail the deployment if the new research sections are missing.
          test -f _site/guides/general-imports-vs-consumption/index.html
          test -f _site/guides/sauna-hts-code/index.html
          test -f _site/guides/cbp-binding-ruling/index.html
          test -f _site/tariffs/index.html
          test -f _site/where-to-buy/index.html
          test -f _site/about/index.html
          test -f _site/reports/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
