name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          mkdir _site
          cp -r assets classifications countries data methodology resources rulings _site/
          cp index.html 404.html robots.txt sitemap.xml llms.txt _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
